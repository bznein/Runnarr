services:
  # Keep the non-production database requirement explicit. Preview and staging
  # hosts consume an installed copy of this override, which can be advanced
  # independently while a production database upgrade is being prepared.
  db:
    image: postgis/postgis:16-3.5-alpine

  app:
    environment:
      RUNNARR_TRUST_PROXY: "true"
    networks:
      runnarr:
        aliases:
          - ${RUNNARR_INGRESS_ALIAS:?non-production ingress alias is required}
