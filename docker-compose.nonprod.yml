services:
  # Keep the non-production database requirement explicit. Preview and staging
  # hosts consume an installed copy of this override, which can be advanced
  # independently while a production database upgrade is being prepared.
  db:
    image: postgis/postgis:16-3.5-alpine

  app:
    environment:
      RUNNARR_TRUST_PROXY: "true"
      # Keep these mappings in the installed non-production override. The
      # preview host can enable routing before the course branches reach main,
      # without replacing production's installed base Compose asset.
      RUNNARR_ROUTING_ENABLED: ${RUNNARR_ROUTING_ENABLED:-false}
      RUNNARR_ROUTING_URL: ${RUNNARR_ROUTING_URL:-http://valhalla:8002}
    networks:
      runnarr:
        aliases:
          - ${RUNNARR_INGRESS_ALIAS:?non-production ingress alias is required}
