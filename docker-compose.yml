services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runnarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runnarr}
      POSTGRES_DB: ${POSTGRES_DB:-runnarr}
    ports:
      - "127.0.0.1:${RUNNARR_DB_HOST_PORT:-5432}:5432"
      - "[::1]:${RUNNARR_DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - runnarr

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://runnarr:runnarr@db:5432/runnarr?sslmode=disable}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      RUNNARR_HTTP_ADDR: ${RUNNARR_CONTAINER_HTTP_ADDR:-:8080}
      RUNNARR_BASE_URL: ${RUNNARR_BASE_URL:-http://localhost:37617}
      RUNNARR_PUBLIC_MODE: ${RUNNARR_PUBLIC_MODE:-false}
      RUNNARR_LOCAL_AUTH_ENABLED: ${RUNNARR_LOCAL_AUTH_ENABLED:-true}
      RUNNARR_TRUST_PROXY: ${RUNNARR_TRUST_PROXY:-false}
      RUNNARR_GOOGLE_CLIENT_ID: ${RUNNARR_GOOGLE_CLIENT_ID:-}
      RUNNARR_GOOGLE_CLIENT_SECRET: ${RUNNARR_GOOGLE_CLIENT_SECRET:-}
      RUNNARR_GOOGLE_REDIRECT_URL: ${RUNNARR_GOOGLE_REDIRECT_URL:-http://localhost:37617/api/providers/google/callback}
      RUNNARR_OIDC_GOOGLE_CLIENT_ID: ${RUNNARR_OIDC_GOOGLE_CLIENT_ID:-}
      RUNNARR_OIDC_GOOGLE_CLIENT_SECRET: ${RUNNARR_OIDC_GOOGLE_CLIENT_SECRET:-}
      RUNNARR_OIDC_GOOGLE_REDIRECT_URL: ${RUNNARR_OIDC_GOOGLE_REDIRECT_URL:-}
      RUNNARR_OIDC_ISSUER_URL: ${RUNNARR_OIDC_ISSUER_URL:-https://accounts.google.com}
      RUNNARR_OIDC_ALLOWED_EMAILS: ${RUNNARR_OIDC_ALLOWED_EMAILS:-}
      RUNNARR_ADMIN_USERNAME: ${RUNNARR_ADMIN_USERNAME:-admin}
      RUNNARR_ADMIN_PASSWORD: ${RUNNARR_ADMIN_PASSWORD:-change-me}
      RUNNARR_ADMIN_PASSWORD_HASH: ${RUNNARR_ADMIN_PASSWORD_HASH:-}
      RUNNARR_SECRET_KEY: ${RUNNARR_SECRET_KEY:-change-this-to-a-long-random-secret-with-at-least-32-bytes}
      RUNNARR_ADMIN_PASSWORD_FILE: ${RUNNARR_ADMIN_PASSWORD_FILE:-}
      RUNNARR_ADMIN_PASSWORD_HASH_FILE: ${RUNNARR_ADMIN_PASSWORD_HASH_FILE:-}
      RUNNARR_SECRET_KEY_FILE: ${RUNNARR_SECRET_KEY_FILE:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
      RUNNARR_ROUTING_ENABLED: ${RUNNARR_ROUTING_ENABLED:-false}
      RUNNARR_ROUTING_URL: ${RUNNARR_ROUTING_URL:-http://graphhopper:8989}
      RUNNARR_MEDIA_DIR: ${RUNNARR_MEDIA_DIR:-/app/data/media}
      RUNNARR_GARMIN_BRIDGE_PYTHON: ${RUNNARR_GARMIN_BRIDGE_PYTHON:-python3}
      RUNNARR_GARMIN_BRIDGE_SCRIPT: ${RUNNARR_GARMIN_BRIDGE_SCRIPT:-/app/garmin_bridge.py}
      RUNNARR_GARMIN_TOKEN_DIR: ${RUNNARR_GARMIN_TOKEN_DIR:-/app/data/garmin_tokens}
      RUNNARR_GOOGLE_CLIENT_SECRET_FILE: ${RUNNARR_GOOGLE_CLIENT_SECRET_FILE:-}
      RUNNARR_OIDC_GOOGLE_CLIENT_SECRET_FILE: ${RUNNARR_OIDC_GOOGLE_CLIENT_SECRET_FILE:-}
    ports:
      - "127.0.0.1:${RUNNARR_PORT:-37617}:8080"
      - "[::1]:${RUNNARR_PORT:-37617}:8080"
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=3));
          assert data["status"]=="ok"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    networks:
      - runnarr

  graphhopper:
    profiles: ["routing"]
    image: ${RUNNARR_GRAPHHOPPER_IMAGE:-israelhikingmap/graphhopper:11.0@sha256:e77e14e48ea69ea7bb0eb71ddc9d583e5ce85dd295475572371f72ed4880a1ff}
    entrypoint: ["/runnarr/graphhopper-entrypoint.sh"]
    environment:
      GRAPHHOPPER_PBF_URL: ${GRAPHHOPPER_PBF_URL:-https://download.geofabrik.de/europe/ireland-and-northern-ireland-latest.osm.pbf}
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xms1g -Xmx4g}
    volumes:
      - graphhopper-data:/data
      - ./deploy/graphhopper.yml:/runnarr/graphhopper.yml:ro
      - ./deploy/graphhopper-entrypoint.sh:/runnarr/graphhopper-entrypoint.sh:ro
    cpus: ${RUNNARR_GRAPHHOPPER_CPU_LIMIT:-2.0}
    mem_limit: ${RUNNARR_GRAPHHOPPER_MEMORY_LIMIT:-6g}
    pids_limit: ${RUNNARR_GRAPHHOPPER_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - runnarr

volumes:
  postgres-data:
  app-data:
  graphhopper-data:

networks:
  runnarr:
