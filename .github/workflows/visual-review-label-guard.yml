name: Visual review label guard

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: visual-review-label-guard-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: Enforce collaborator approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove visual labels after an untrusted action
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const action = context.payload.action;
            const pull = context.payload.pull_request;
            const eventLabel = context.payload.label?.name ?? "";
            if (action === "labeled" && !eventLabel.startsWith("visual:")) return;

            const trusted = new Set(["admin", "maintain", "write"]);
            let actorTrusted = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              actorTrusted = trusted.has(data.permission) || trusted.has(data.role_name);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (actorTrusted) return;

            const labels = pull.labels
              .map(label => typeof label === "string" ? label : label.name)
              .filter(label => label.startsWith("visual:"));
            if (labels.length === 0) return;

            for (const label of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pull.number,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const marker = "<!-- runnarr-visual-review -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            const body = `${marker}
            ### Visual review

            Visual review requires a write-level collaborator to approve the current commit \`${pull.head.sha}\`.

            The previous visual labels were removed after an untrusted \`${action}\` event. Reapply the affected profiles to record this head.
            `;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body
              });
            }
