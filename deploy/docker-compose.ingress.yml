services:
  gateway:
    image: ${RUNNARR_INGRESS_IMAGE:-nginx:1.29-alpine}
    container_name: runnarr-nonprod-gateway
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${RUNNARR_INGRESS_NGINX_CONFIG:?rendered ingress config is required}:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    networks:
      nonprod-ingress:
        aliases:
          - gateway

  cloudflared:
    image: ${RUNNARR_CLOUDFLARED_IMAGE:-cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf}
    container_name: runnarr-nonprod-cloudflared
    restart: unless-stopped
    # Root owns the bind-mounted tunnel credentials. The container retains no
    # Linux capabilities and cannot modify its filesystem or host mounts.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - run
    volumes:
      - ${RUNNARR_CLOUDFLARED_CONFIG:?rendered tunnel config is required}:/etc/cloudflared/config.yml:ro
      - ${RUNNARR_TUNNEL_CREDENTIALS:?tunnel credentials file is required}:/run/secrets/tunnel-credentials.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - nonprod-ingress
    depends_on:
      - gateway

networks:
  nonprod-ingress:
    external: true
    name: ${RUNNARR_NONPROD_INGRESS_NETWORK:-runnarr-nonprod-ingress}
