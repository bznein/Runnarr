services:
  app:
    environment:
      RUNNARR_ROUTING_ENABLED: ${RUNNARR_ROUTING_ENABLED:-true}
      RUNNARR_ROUTING_URL: http://graphhopper:8989

  graphhopper:
    image: ${RUNNARR_GRAPHHOPPER_IMAGE:-israelhikingmap/graphhopper:11.0@sha256:e77e14e48ea69ea7bb0eb71ddc9d583e5ce85dd295475572371f72ed4880a1ff}
    restart: unless-stopped
    entrypoint: ["/runnarr/graphhopper-entrypoint.sh"]
    environment:
      GRAPHHOPPER_PBF_URL: ${GRAPHHOPPER_PBF_URL:?a regional GraphHopper PBF URL is required}
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xms1g -Xmx4g}
    volumes:
      - graphhopper-data:/data
      - ${RUNNARR_DEPLOY_ASSETS:-/opt/runnarr-deploy}/deploy/graphhopper.yml:/runnarr/graphhopper.yml:ro
      - ${RUNNARR_DEPLOY_ASSETS:-/opt/runnarr-deploy}/deploy/graphhopper-entrypoint.sh:/runnarr/graphhopper-entrypoint.sh:ro
    cpus: ${RUNNARR_GRAPHHOPPER_CPU_LIMIT:-2.0}
    mem_limit: ${RUNNARR_GRAPHHOPPER_MEMORY_LIMIT:-6g}
    pids_limit: ${RUNNARR_GRAPHHOPPER_PIDS_LIMIT:-512}
    labels:
      com.runnarr.managed: "true"
      com.runnarr.environment: production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  graphhopper-data:
    name: runnarr-production-graphhopper-data
